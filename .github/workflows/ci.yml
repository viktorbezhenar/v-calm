name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t v-calm:ci .
      - name: Smoke test
        run: |
          docker run -d --rm --name vc -p 8080:8080 --read-only --tmpfs /tmp --tmpfs /var/cache/nginx --cap-drop ALL v-calm:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/ >/dev/null && break; sleep 0.5; done
          curl -fsSI http://localhost:8080/ | grep -i "content-security-policy"
          curl -fsS http://localhost:8080/sw.js | grep -q "vcalm-"
          docker stop vc
